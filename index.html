<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gnizdo</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding-top: 40px;
            margin: 0;
            padding-left: 20px;
            padding-right: 20px;
        }
        input, button {
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-top: 10px;
            width: 100%;
            max-width: 300px;
            box-sizing: border-box;
        }
        button {
            background-color: #007aff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button.google-btn {
            background-color: #db4437;
        }
        #app-content {
            display: none; /* Скрыто до авторизации */
        }
        #login-screen {
            margin-top: 60px;
        }
        #cloud-data {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #007aff;
        }
    </style>
</head>
<body>

    <h1>Gnizdo 🪺</h1>

    <!-- Экран входа (если пользователь не авторизован) -->
    <div id="login-screen">
        <p>Для доступа к уютному пространству войдите через Google</p>
        <button id="loginBtn" class="google-btn">Войти через Google</button>
    </div>

    <!-- Основной интерфейс приложения (доступен после входа) -->
    <div id="app-content">
        <p>Общее пространство для двоих</p>
        <input type="text" id="noteInput" placeholder="Напишите общую заметку...">
        <br>
        <button id="saveBtn">Сохранить в облако</button>
        
        <div id="cloud-data">Загрузка данных из облака...</div>
        <br>
        <button id="logoutBtn" style="background-color: #666; margin-top: 40px;">Выйти</button>
    </div>

    <!-- Подключаем Firebase через модули -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Вставьте сюда ваши ключи из панели Firebase:
        const firebaseConfig = {
  apiKey: "AIzaSyCqQpi4D-A9JbmoJaWeKrkHM8q_SY9NfH0",
  authDomain: "gnizdo-db.firebaseapp.com",
  projectId: "gnizdo-db",
  storageBucket: "gnizdo-db.firebasestorage.app",
  messagingSenderId: "595648318799",
  appId: "1:595648318799:web:4b88cfbaff2471d5af493a"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const loginScreen = document.getElementById('login-screen');
        const appContent = document.getElementById('app-content');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const saveBtn = document.getElementById('saveBtn');
        const input = document.getElementById('noteInput');
        const display = document.getElementById('cloud-data');

        let unsubscribe = null;

        // 1. Отслеживание состояния авторизации
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Пользователь вошел — показываем приложение
                loginScreen.style.display = 'none';
                appContent.style.display = 'block';
                initApp();
            } else {
                // Пользователь не вошел — показываем кнопку входа
                loginScreen.style.display = 'block';
                appContent.style.display = 'none';
                if (unsubscribe) unsubscribe(); // отключаем слушатель базы при выходе
            }
        });

        // 2. Кнопка входа через Google
        loginBtn.addEventListener('click', () => {
            signInWithPopup(auth, provider).catch((error) => {
                console.error("Ошибка входа:", error);
                alert("Не удалось войти: " + error.message);
            });
        });

        // 3. Кнопка выхода
        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        // 4. Логика работы с базой данных (вызывается после успешного входа)
        function initApp() {
            const noteRef = doc(db, "notes", "shared_note");

            // Слушаем изменения в реальном времени
            unsubscribe = onSnapshot(noteRef, (docSnap) => {
                if (docSnap.exists()) {
                    display.textContent = `В облаке: ${docSnap.data().text || ""}`;
                } else {
                    display.textContent = "Пока нет записей";
                }
            }, (error) => {
                console.error("Ошибка чтения БД:", error);
            });

            // Сохранение данных
            saveBtn.onclick = async () => {
                try {
                    await setDoc(noteRef, {
                        text: input.value,
                        updatedBy: auth.currentUser.email,
                        updatedAt: new Date()
                    });
                    alert('Сохранено в защищенное облако!');
                } catch (e) {
                    console.error("Ошибка сохранения: ", e);
                    alert('Ошибка при сохранении');
                }
            };
        }

        // Регистрация Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log('Service Worker зарегистрирован!'))
                    .catch(err => console.log('Ошибка SW:', err));
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Настройки — Gnizdo</title>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-main: #1c1c1e;
            --text-secondary: #8e8e93;
            --accent: #007aff;
            --border-color: #e5e5ea;
            --danger: #ff3b30;
        }
        :root[data-theme="dark"] {
            --bg-color: #0f1115;
            --card-bg: #1c1f24;
            --text-main: #f5f5f7;
            --text-secondary: #a7a9ae;
            --accent: #0a84ff;
            --border-color: #34373d;
            --danger: #ff453a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
        }
        .settings-page { max-width: 600px; margin: 0 auto; padding: 16px 12px 40px; }
        header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        header h1 { margin: 0; font-size: 22px; }
        .back-button { border: none; background: var(--card-bg); color: var(--text-main); border-radius: 10px; padding: 10px 12px; cursor: pointer; text-decoration: none; }
        .settings-card { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .settings-card h2 { margin: 0 0 14px; font-size: 17px; }
        .theme-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .theme-button { border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-main); border-radius: 12px; padding: 12px; font-weight: 600; cursor: pointer; }
        .theme-button.active { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent); }
        .category-add { display: flex; gap: 8px; margin-bottom: 12px; }
        .category-input { flex: 1; min-width: 0; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-main); border-radius: 12px; padding: 11px 12px; font-size: 15px; }
        .add-button { border: none; background: var(--accent); color: white; border-radius: 12px; padding: 11px 14px; font-weight: 700; cursor: pointer; }
        .category-list { list-style: none; margin: 0; padding: 0; }
        .category-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--border-color); }
        .category-name { flex: 1; overflow-wrap: anywhere; }
        .category-action { border: none; border-radius: 9px; padding: 8px 10px; background: var(--bg-color); color: var(--text-main); cursor: pointer; }
        .category-action.delete { color: var(--danger); }
        .empty-state { color: var(--text-secondary); text-align: center; padding: 12px 0 4px; }
    </style>
</head>
<body>
    <main class="settings-page">
        <header>
            <a class="back-button" href="index.html" aria-label="Назад">←</a>
            <h1>Настройки</h1>
        </header>
        <section class="settings-card">
            <h2>Тема приложения</h2>
            <div class="theme-options">
                <button class="theme-button" type="button" data-theme-choice="light">☀️ Светлая</button>
                <button class="theme-button" type="button" data-theme-choice="dark">🌙 Тёмная</button>
            </div>
        </section>
        <section class="settings-card">
            <h2>Категории</h2>
            <div class="category-add">
                <input id="categoryInput" class="category-input" type="text" placeholder="Новая категория">
                <button id="addCategoryButton" class="add-button" type="button">Добавить</button>
            </div>
            <ul id="categoryList" class="category-list"></ul>
        </section>
    </main>
    <script type="module" src="settings.js"></script>
</body>
</html>
